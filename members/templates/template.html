<!DOCTYPE html>
<html>
<body>

<ul> <!-- Start of an unordered list -->
    <!-- Django template loop: iterates through each object in 'mymembers' -->
  {% for x in mymembers %}
   <!-- Displays the firstname field of each member object -->
    <li>{{ x.firstname }}</li>
  {% endfor %}   <!-- End of the loop -->
</ul>

<p>In views.py you can see how to import and fetch members from the database.</p>

</body>
</html>
